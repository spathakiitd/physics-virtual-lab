        // --- 3. SIMULATION IMPLEMENTATIONS ---

        // Base class for lifecycle management
        class Simulation {
            constructor(config, container) {
                this.config = config;
                this.container = container;
                this.params = {};
                // Initialize default params
                config.params.forEach(p => this.params[p.id] = parseFloat(p.default));
                this.animId = null;
                this.isRunning = true;
            }
            updateParam(id, value) {
                this.params[id] = parseFloat(value);
                this.render();
            }
            startLoop(drawFunc) {
                const loop = (timestamp) => {
                    if (!this.isRunning) return;
                    drawFunc(timestamp);
                    this.animId = requestAnimationFrame(loop);
                };
                this.animId = requestAnimationFrame(loop);
            }
            destroy() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
                this.container.innerHTML = '';
            }
            render() {} // Override
        }

        // 3.0 Iframe Engine (For loading separate HTML files)
        class IframeSim extends Simulation {
            init() {
                // Creates an iframe to load external HTML simulations
                // bg-white is used so that standard HTML files without dark mode stay readable
                this.container.innerHTML = `<iframe src="${this.config.url}" class="w-full h-full border-0 rounded bg-white" title="${this.config.title}"></iframe>`;
            }
            updateParam(id, value) {
                super.updateParam(id, value);
                // Advanced: Send data to the iframe if the external HTML listens for Window postMessages
                const iframe = this.container.querySelector('iframe');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'UPDATE_PARAM', id, value }, '*');
                }
            }
        }

        // 3.0.1 Quantum Tunneling
        class QuantumTunnelingSim extends Simulation {
            init() {
                this.container.innerHTML = '<div id="qt-plotly" style="width:100%;height:100%;"></div>';
                this.render();
            }
            render() {
                const E = this.params.energy;
                const V0 = this.params.v0;
                const a = this.params.width;

                const x = [], V = [], psiRe = [], psiSq = [];
                const k1 = Math.sqrt(E);
                const kappa = V0 > E ? Math.sqrt(V0 - E) : 0;
                const k2 = V0 < E ? Math.sqrt(E - V0) : 0;
                
                for(let i = -2; i <= 3; i += 0.02) {
                    x.push(i);
                    if (i < 0) {
                        V.push(0);
                        let re = Math.cos(k1 * 10 * i) + (V0 > E ? 0.5 * Math.cos(-k1 * 10 * i) : 0);
                        psiRe.push(re*0.4 + E);
                        psiSq.push(re*re * 0.1 + E);
                    } else if (i >= 0 && i <= a) {
                        V.push(V0);
                        if (V0 > E) {
                            let decay = Math.exp(-kappa * 5 * i);
                            psiRe.push(decay*0.4 + E);
                            psiSq.push(decay*decay * 0.1 + E);
                        } else {
                            let osc = Math.cos(k2 * 10 * i);
                            psiRe.push(osc*0.4 + E);
                            psiSq.push(osc*osc * 0.1 + E);
                        }
                    } else {
                        V.push(0);
                        if (V0 > E) {
                            let amp = Math.exp(-kappa * 5 * a);
                            let trans = amp * Math.cos(k1 * 10 * (i - a));
                            psiRe.push(trans*0.4 + E);
                            psiSq.push(trans*trans * 0.1 + E);
                        } else {
                            let trans = Math.cos(k1 * 10 * (i - a));
                            psiRe.push(trans*0.4 + E);
                            psiSq.push(trans*trans * 0.1 + E);
                        }
                    }
                }

                const traceV = { x: x, y: V, type: 'scatter', mode: 'lines', name: 'V(x)', line: {color: '#94a3b8', width: 3, shape: 'hv'} };
                const traceE = { x: [-2, 3], y: [E, E], type: 'scatter', mode: 'lines', name: 'Energy (E)', line: {color: '#06b6d4', width: 2, dash: 'dash'} };
                const tracePsi = { x: x, y: psiRe, type: 'scatter', mode: 'lines', name: 'Re[ψ]', line: {color: '#a855f7', width: 2} };
                const traceProb = { x: x, y: psiSq, type: 'scatter', mode: 'lines', name: '|ψ|²', fill: 'tonexty', fillcolor: 'rgba(239, 68, 68, 0.2)', line: {color: '#ef4444', width: 1} };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { color: '#cbd5e1' },
                    xaxis: { title: 'Position x (nm)', gridcolor: '#334155' },
                    yaxis: { title: 'Energy / Amplitude', range: [-0.5, Math.max(3.5, V0 + 1)], gridcolor: '#334155' },
                    margin: { t: 40, b: 40, l: 50, r: 20 }
                };

                Plotly.react('qt-plotly', [traceV, traceE, traceProb, tracePsi], layout, {displayModeBar: false});
            }
        }

                const n = this.params.n;
                const L = this.params.L; // in nm
                const massFactor = this.params.mass; // 1 for e, larger for muon
                
                const points = 500;
                const x = [], psi = [], prob = [], v = [], eLine = [];
                
                // Constants adapted for reasonable display scaling
                const E0 = (1 / massFactor) * (1 / (L*L)); 
                const En = n * n * E0;

                for (let i = 0; i <= points; i++) {
                    const xi = (i / points) * L;
                    x.push(xi);
                    
                    // psi = sqrt(2/L) * sin(n*pi*x/L)
                    const psiVal = Math.sqrt(2/L) * Math.sin((n * Math.PI * xi) / L);
                    psi.push(psiVal + En); // Offset by energy for visualization
                    prob.push((psiVal * psiVal) + En);
                    
                    v.push(0); // Potential is 0 inside
                    eLine.push(En);
                }

                // Add walls
                x.unshift(0); v.unshift(En * 2); psi.unshift(En*2); prob.unshift(En*2);
                x.push(L); v.push(En * 2); psi.push(En*2); prob.push(En*2);

                const traceV = { x: x, y: v, type: 'scatter', mode: 'lines', name: 'V(x)', line: {color: '#94a3b8', width: 4, shape: 'hv'} };
                const traceE = { x: x, y: eLine, type: 'scatter', mode: 'lines', name: `E_${n}`, line: {color: '#06b6d4', width: 2, dash: 'dash'} };
                const tracePsi = { x: x, y: psi, type: 'scatter', mode: 'lines', name: 'ψ(x)', line: {color: '#a855f7', width: 2}, fill: 'tonexty', fillcolor: 'rgba(168, 85, 247, 0.1)' };
                const traceProb = { x: x, y: prob, type: 'scatter', mode: 'lines', name: '|ψ(x)|²', line: {color: '#ef4444', width: 2}, fill: 'tonexty', fillcolor: 'rgba(239, 68, 68, 0.2)' };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#cbd5e1' },
                    xaxis: { title: 'Position x (nm)', range: [-0.1*L, 1.1*L], gridcolor: '#334155' },
                    yaxis: { title: 'Energy (arb. units)', range: [0, Math.max(En * 2.5, 5)], gridcolor: '#334155' },
                    margin: { t: 40, b: 40, l: 50, r: 20 },
                    showlegend: true,
                    legend: { orientation: "h", yanchor: "bottom", y: 1.02, xanchor: "right", x: 1 }
                };

                Plotly.newPlot('plotly-div', [traceV, traceE, tracePsi, traceProb], layout, {responsive: true, displayModeBar: false});
            }
        }

        // 3.2 Electric Field Vectors
        class ElectricFieldSim extends Simulation {
            init() {
                this.container.innerHTML = '<canvas id="sim-canvas"></canvas>';
                this.canvas = document.getElementById('sim-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.charges = [
                    {x: 0.3, y: 0.5, q: 2},
                    {x: 0.7, y: 0.5, q: -2}
                ];
                
                this.resize = () => {
                    this.canvas.width = this.container.clientWidth;
                    this.canvas.height = this.container.clientHeight;
                    this.render();
                };
                window.addEventListener('resize', this.resize);
                this.resize();

                // Interactions
                let dragging = null;
                let isAdding = false;
                
                // Expose to custom UI buttons
                window.handleCustomSimAction = (action) => {
                    if (action === 'add') { isAdding = true; this.canvas.style.cursor = 'crosshair'; }
                    if (action === 'clear') { this.charges = []; this.render(); }
                };

                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / this.canvas.width;
                    const y = (e.clientY - rect.top) / this.canvas.height;
                    
                    if (isAdding) {
                        this.charges.push({x, y, q: this.params.chargeMag});
                        isAdding = false;
                        this.canvas.style.cursor = 'default';
                        this.render();
                        return;
                    }

                    // Check if clicking existing charge
                    for (let c of this.charges) {
                        if (MathUtils.dist(x*this.canvas.width, y*this.canvas.height, c.x*this.canvas.width, c.y*this.canvas.height) < 20) {
                            dragging = c;
                            break;
                        }
                    }
                });
                
                this.canvas.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    const rect = this.canvas.getBoundingClientRect();
                    dragging.x = (e.clientX - rect.left) / this.canvas.width;
                    dragging.y = (e.clientY - rect.top) / this.canvas.height;
                    this.render();
                });
                
                this.canvas.addEventListener('mouseup', () => { dragging = null; });
            }
            
            destroy() {
                super.destroy();
                window.removeEventListener('resize', this.resize);
                delete window.handleCustomSimAction;
            }

            render() {
                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;
                
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, w, h);
                
                const res = this.params.gridRes;
                const dx = w / res;
                const dy = h / res;
                
                // Draw Vector Field
                for (let i = 0; i <= res; i++) {
                    for (let j = 0; j <= res; j++) {
                        const px = i * dx;
                        const py = j * dy;
                        
                        let Ex = 0, Ey = 0;
                        for (let c of this.charges) {
                            const cx = c.x * w;
                            const cy = c.y * h;
                            const r2 = MathUtils.dist2(px, py, cx, cy);
                            if (r2 < 1) continue; // prevent singularity
                            const r = Math.sqrt(r2);
                            const E = c.q / r2; // ignoring k for vis scale
                            Ex += E * (px - cx) / r;
                            Ey += E * (py - cy) / r;
                        }
                        
                        const mag = Math.sqrt(Ex*Ex + Ey*Ey);
                        if (mag === 0) continue;
                        
                        // Normalize and scale for rendering
                        const maxLen = dx * 0.8;
                        // Log scale length to show weak fields
                        const drawLen = Math.min(maxLen, (Math.log10(mag * 10000 + 1) / 3) * maxLen * 0.5);
                        
                        const ux = (Ex / mag) * drawLen;
                        const uy = (Ey / mag) * drawLen;
                        
                        // Color mapping based on potential/magnitude
                        const hue = MathUtils.map(Math.min(mag, 0.05), 0, 0.05, 200, 360);
                        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.6)`;
                        ctx.lineWidth = 1.5;
                        
                        this.drawArrow(ctx, px, py, px + ux, py + uy);
                    }
                }
                
                // Draw Charges
                for (let c of this.charges) {
                    ctx.beginPath();
                    ctx.arc(c.x * w, c.y * h, Math.abs(c.q)*3 + 5, 0, Math.PI*2);
                    ctx.fillStyle = c.q > 0 ? '#ef4444' : '#3b82f6';
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    ctx.fillStyle = 'white';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = '12px Inter';
                    ctx.fillText(c.q > 0 ? '+' : '-', c.x * w, c.y * h);
                }
            }
            
            drawArrow(ctx, fromx, fromy, tox, toy) {
                const headlen = 4;
                const dx = tox - fromx;
                const dy = toy - fromy;
                const angle = Math.atan2(dy, dx);
                ctx.beginPath();
                ctx.moveTo(fromx, fromy);
                ctx.lineTo(tox, toy);
                ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(tox, toy);
                ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
                ctx.stroke();
            }
        }

        // 3.3 Maxwell Boltzmann
        class MaxwellBoltzmannSim extends Simulation {
            init() {
                this.container.innerHTML = '<div id="mb-plotly" style="width:100%;height:100%;"></div>';
                this.render();
            }
            render() {
                const T = this.params.T;
                const m_amu = this.params.mass;
                const m_kg = m_amu * 1.660539e-27;
                const kB = Constants.kB;
                
                const speeds = [];
                const probs = [];
                
                // Determine sensible speed range based on Vrms
                const vrms = Math.sqrt(3 * kB * T / m_kg);
                const max_v = vrms * 3;
                
                const factor1 = 4 * Math.PI * Math.pow(m_kg / (2 * Math.PI * kB * T), 1.5);
                
                for(let v = 0; v < max_v; v += max_v/200) {
                    speeds.push(v);
                    const exponent = -(m_kg * v * v) / (2 * kB * T);
                    const f_v = factor1 * v * v * Math.exp(exponent);
                    probs.push(f_v);
                }

                const trace = { 
                    x: speeds, y: probs, 
                    type: 'scatter', mode: 'lines', name: 'f(v)', 
                    line: {color: '#f59e0b', width: 3},
                    fill: 'tozeroy', fillcolor: 'rgba(245, 158, 11, 0.2)'
                };
                
                const v_mp = Math.sqrt(2 * kB * T / m_kg); // most probable
                
                const shapes = [
                    { type: 'line', x0: v_mp, y0: 0, x1: v_mp, y1: Math.max(...probs), line: {color: 'white', width: 1, dash: 'dot'} }
                ];

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#cbd5e1' },
                    xaxis: { title: 'Speed v (m/s)', range: [0, max_v], gridcolor: '#334155' },
                    yaxis: { title: 'Probability Density f(v)', gridcolor: '#334155', zeroline: false },
                    margin: { t: 40, b: 40, l: 60, r: 20 },
                    shapes: shapes,
                    annotations: [{ x: v_mp, y: Math.max(...probs)*1.05, text: `v_mp ≈ ${Math.round(v_mp)} m/s`, showarrow: false, font: {color: 'white', size: 10} }]
                };

                Plotly.newPlot('mb-plotly', [trace], layout, {responsive: true, displayModeBar: false});
            }
        }

        // 3.4 Harmonic Oscillator
        class HarmonicOscillatorSim extends Simulation {
            init() {
                this.container.innerHTML = `
                    <div class="flex flex-col h-full w-full">
                        <canvas id="ho-canvas" class="flex-1 bg-slate-900 border-b border-slate-700"></canvas>
                        <div id="ho-plot" class="flex-1"></div>
                    </div>
                `;
                this.canvas = document.getElementById('ho-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.time = 0;
                this.history = { t: [], x: [] };
                
                this.resize = () => {
                    this.canvas.width = this.canvas.clientWidth;
                    this.canvas.height = this.canvas.clientHeight;
                };
                window.addEventListener('resize', this.resize);
                this.resize();
                
                this.startLoop((timestamp) => this.draw(timestamp));
            }

            destroy() {
                super.destroy();
                window.removeEventListener('resize', this.resize);
            }

            draw(timestamp) {
                // Throttle physics updates
                if(!this.lastTime) this.lastTime = timestamp;
                const dt = (timestamp - this.lastTime) / 1000; // seconds
                this.lastTime = timestamp;
                
                this.time += dt;
                
                const m = this.params.m;
                const k = this.params.k;
                const A = this.params.A;
                
                const omega = Math.sqrt(k / m);
                const x = A * Math.cos(omega * this.time);
                
                // Visuals
                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;
                
                ctx.clearRect(0, 0, w, h);
                
                const originX = w / 2;
                const ceilingY = 20;
                
                // Map logical x (-2 to 2) to pixels
                const scale = (h - 100) / 4; 
                const blockY = h/2 + x * scale;
                const blockW = 40 + m * 5; // Size depends on mass
                
                // Draw ceiling
                ctx.fillStyle = '#64748b';
                ctx.fillRect(originX - 50, 0, 100, ceilingY);
                
                // Draw Spring
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(originX, ceilingY);
                const coils = 10;
                for(let i=1; i<=coils; i++) {
                    const py = ceilingY + (blockY - ceilingY) * (i / coils);
                    const px = originX + (i % 2 === 0 ? 15 : -15);
                    if(i === coils) ctx.lineTo(originX, blockY);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                
                // Draw Mass
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(originX - blockW/2, blockY, blockW, blockW);
                ctx.strokeStyle = '#0284c7';
                ctx.strokeRect(originX - blockW/2, blockY, blockW, blockW);
                
                // Update Plotly every ~100ms to save resources
                if (Math.floor(this.time * 10) % 2 === 0) {
                    this.history.t.push(this.time);
                    this.history.x.push(x);
                    if (this.history.t.length > 100) {
                        this.history.t.shift();
                        this.history.x.shift();
                    }
                    this.updatePlot();
                }
            }

            updatePlot() {
                if(!document.getElementById('ho-plot')) return;
                const trace = {
                    x: this.history.t, y: this.history.x,
                    type: 'scatter', mode: 'lines', line: {color: '#38bdf8', width: 2}
                };
                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { color: '#cbd5e1' },
                    xaxis: { title: 'Time (s)', gridcolor: '#334155' },
                    yaxis: { title: 'Displacement x (m)', range: [-this.params.A*1.2, this.params.A*1.2], gridcolor: '#334155' },
                    margin: { t: 10, b: 40, l: 50, r: 20 }
                };
                Plotly.react('ho-plot', [trace], layout, {displayModeBar: false});
            }
        }

        // 3.5 Electromagnetic Wave (2.5D Canvas Render)
        class EMWaveSim extends Simulation {
            init() {
                this.container.innerHTML = '<canvas id="em-canvas"></canvas>';
                this.canvas = document.getElementById('em-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.time = 0;
                
                this.resize = () => {
                    this.canvas.width = this.container.clientWidth;
                    this.canvas.height = this.container.clientHeight;
                };
                window.addEventListener('resize', this.resize);
                this.resize();
                
                this.startLoop(() => this.draw());
            }

            destroy() {
                super.destroy();
                window.removeEventListener('resize', this.resize);
            }

            draw() {
                this.time += 0.05 * this.params.speed;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const ctx = this.ctx;
                
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, w, h);
                
                // Center and projection setup
                const ox = 50;
                const oy = h / 2;
                const zScale = 0.5; // skew for pseudo 3D
                
                // Draw axes
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, oy); ctx.lineTo(w, oy); // Z axis (prop)
                ctx.moveTo(ox, 0); ctx.lineTo(ox, h); // X axis (E)
                ctx.moveTo(ox - 100*zScale, oy + 100*zScale); ctx.lineTo(ox + 200*zScale, oy - 200*zScale); // Y axis (B)
                ctx.stroke();

                const lambdaPixels = this.params.lambda; // Scale for vis
                const k = (2 * Math.PI) / lambdaPixels;
                const amplitude = h * 0.25;

                // Draw waves
                ctx.lineWidth = 2;
                
                for (let z = 0; z < w; z += 5) {
                    const phase = k * z - this.time;
                    const val = Math.cos(phase) * amplitude;
                    
                    // Electric Field (XY Plane, up/down)
                    if (z % 20 === 0) {
                        ctx.strokeStyle = '#ef4444'; // Red for E
                        ctx.beginPath();
                        ctx.moveTo(ox + z, oy);
                        ctx.lineTo(ox + z, oy - val);
                        ctx.stroke();
                    }
                    
                    // Magnetic Field (XZ Plane, skewed)
                    if (z % 20 === 0) {
                        ctx.strokeStyle = '#3b82f6'; // Blue for B
                        ctx.beginPath();
                        ctx.moveTo(ox + z, oy);
                        ctx.lineTo(ox + z + val*zScale, oy - val*zScale);
                        ctx.stroke();
                    }
                }
                
                // Draw Envelopes
                ctx.beginPath(); ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
                for (let z = 0; z < w; z++) {
                    const y = oy - Math.cos(k * z - this.time) * amplitude;
                    z === 0 ? ctx.moveTo(ox, y) : ctx.lineTo(ox + z, y);
                } ctx.stroke();
                
                ctx.beginPath(); ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
                for (let z = 0; z < w; z++) {
                    const val = Math.cos(k * z - this.time) * amplitude;
                    const bX = ox + z + val*zScale;
                    const bY = oy - val*zScale;
                    z === 0 ? ctx.moveTo(bX, bY) : ctx.lineTo(bX, bY);
                } ctx.stroke();

                // Legend
                ctx.fillStyle = '#ef4444'; ctx.fillText("E-Field", 20, 30);
                ctx.fillStyle = '#3b82f6'; ctx.fillText("B-Field", 20, 50);
                ctx.fillStyle = 'white'; ctx.fillText("Propagation (k)", w - 100, oy - 10);
            }
        }

                <div class="py-12 px-6 max-w-5xl mx-auto w-full">
                    <button onclick="window.history.back()" class="text-sm text-slate-400 hover:text-white mb-8 flex items-center">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Back
                    </button>
                    <div class="flex items-center mb-4">
                        <i data-lucide="${subject.icon}" class="w-10 h-10 mr-4 ${subject.color}"></i>
                        <h1 class="text-4xl font-bold text-white">${subject.title}</h1>
                    </div>
                    <p class="text-xl text-slate-400 mb-12 border-b border-slate-800 pb-8">${subject.desc}</p>
                    
                    <h2 class="text-xl font-semibold text-white mb-6">Available Experiments</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${simCards}
                    </div>
                </div>
            `;
        }

        function renderSimulation(container, simId) {
            const config = Registry[simId];
            if (!config) return navigate('home');

            // Generate Control Panel UI
            let controlsHTML = '';
            config.params.forEach(p => {
                if (p.type === 'slider') {
                    controlsHTML += `
                        <div class="mb-5">
                            <div class="flex justify-between items-end mb-1">
                                <label class="block text-sm font-medium text-slate-300">${p.name}</label>
                                <span id="val-${p.id}" class="text-xs font-mono text-sci-accent bg-slate-900 px-2 py-0.5 rounded border border-slate-700">${p.default} ${p.unit}</span>
                            </div>
                            <input type="range" id="input-${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.default}" 
                                oninput="document.getElementById('val-${p.id}').innerText = this.value + ' ${p.unit}'; updateSimParam('${p.id}', this.value)">
                        </div>
                    `;
                } else if (p.type === 'select') {
                    let options = p.options.map(opt => `<option value="${opt.val}" ${opt.val == p.default ? 'selected' : ''}>${opt.label}</option>`).join('');
                    controlsHTML += `
                        <div class="mb-5">
                            <label class="block text-sm font-medium text-slate-300 mb-1">${p.name}</label>
                            <select id="input-${p.id}" class="w-full bg-slate-900 border border-slate-700 rounded-md py-1.5 px-3 text-sm text-slate-300 focus:outline-none focus:border-sci-accent"
                                onchange="updateSimParam('${p.id}', this.value)">
                                ${options}
                            </select>
                        </div>
                    `;
                }
            });

            if(config.customControls) controlsHTML += config.customControls;

            container.innerHTML = `
                <!-- Top Bar -->
                <div class="bg-sci-panel border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-16 z-40">
                    <div class="flex items-center">
                        <button onclick="window.location.hash='#subject/${config.subjectId}'" class="text-slate-400 hover:text-white mr-4 p-1 rounded hover:bg-slate-800">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h2 class="text-lg font-bold text-white leading-tight">${config.title}</h2>
                            <span class="text-xs text-slate-500">${config.category}</span>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded text-sm flex items-center transition" onclick="window.dispatchEvent(new Event('resize'))">
                            <i data-lucide="maximize" class="w-4 h-4 mr-1"></i> Recenter
                        </button>
                    </div>
                </div>

                <!-- Main Layout -->
                <div class="flex flex-col lg:flex-row flex-grow w-full h-[calc(100vh-120px)]">
                    
                    <!-- Sidebar Controls -->
                    <div class="w-full lg:w-80 bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto shrink-0">
                        <!-- Tabs -->
                        <div class="flex border-b border-slate-800 text-sm">
                            <button id="tab-explore" onclick="switchSimTab('explore')" class="flex-1 py-3 font-medium text-center tab-active hover:bg-slate-800 transition">Control Panel</button>
                            <button id="tab-understand" onclick="switchSimTab('understand')" class="flex-1 py-3 font-medium text-center text-slate-400 hover:bg-slate-800 transition">Theory</button>
                        </div>
                        
                        <!-- Panel Content -->
                        <div id="panel-explore" class="p-5 flex-grow">
                            ${controlsHTML}
                        </div>
                        
                        <div id="panel-understand" class="p-5 hidden text-sm text-slate-300 leading-relaxed overflow-y-auto">
                            <div class="mb-4">
                                <h4 class="font-bold text-white mb-1 border-b border-slate-700 pb-1">Description</h4>
                                <p>${config.description}</p>
                            </div>
                            <div class="mb-4">
                                <h4 class="font-bold text-white mb-1 border-b border-slate-700 pb-1">Learning Objectives</h4>
                                <ul class="list-disc pl-4 space-y-1 mt-2">
                                    ${config.objectives.map(obj => `<li>${obj}</li>`).join('')}
                                </ul>
                            </div>
                            <div>
                                <h4 class="font-bold text-white mb-1 border-b border-slate-700 pb-1">Mathematical Model</h4>
                                <div class="math-container text-[13px] bg-black/30 p-2 rounded border border-slate-800 mt-2">
                                    ${config.equations}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Visualization Area -->
                    <div class="flex-grow bg-black relative flex flex-col overflow-hidden">
                        <div id="sim-container" class="flex-grow w-full h-full relative">
                            <!-- Canvas or Plotly goes here -->
                        </div>
                        
                        <!-- Data Overlay (Optional) -->
                        <div class="absolute bottom-4 right-4 glass-panel px-3 py-2 rounded text-xs font-mono text-slate-400 pointer-events-none hidden md:block">
                            Engine: ${config.engine.toUpperCase()} | Render: 60fps
                        </div>
                    </div>
                </div>
            `;

            // Attach event listeners for custom buttons if they exist
            if(config.customControls) {
                const btnAdd = document.getElementById('btnAddCharge');
                const btnClear = document.getElementById('btnClear');
                if(btnAdd) btnAdd.onclick = () => window.handleCustomSimAction('add');
                if(btnClear) btnClear.onclick = () => window.handleCustomSimAction('clear');
            }

            // Render Math
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false,
                output: 'html'
            });

            // Initialize specific simulation class
            const simContainer = document.getElementById('sim-container');
            if (config.ClassRef === 'InfiniteWellSim') AppState.currentSim = new InfiniteWellSim(config, simContainer);
            else if (config.ClassRef === 'IframeSim') AppState.currentSim = new IframeSim(config, simContainer);
            else if (config.ClassRef === 'QuantumTunnelingSim') AppState.currentSim = new QuantumTunnelingSim(config, simContainer);
            else if (config.ClassRef === 'ElectricFieldSim') AppState.currentSim = new ElectricFieldSim(config, simContainer);
            else if (config.ClassRef === 'MaxwellBoltzmannSim') AppState.currentSim = new MaxwellBoltzmannSim(config, simContainer);
            else if (config.ClassRef === 'HarmonicOscillatorSim') AppState.currentSim = new HarmonicOscillatorSim(config, simContainer);
            else if (config.ClassRef === 'EMWaveSim') AppState.currentSim = new EMWaveSim(config, simContainer);

            if (AppState.currentSim) {
                AppState.currentSim.init();
            } else {
                simContainer.innerHTML = '<div class="flex items-center justify-center h-full text-slate-500">Simulation engine failed to load.</div>';
            }
        }

        // Global handlers for HTML inline events
        window.updateSimParam = function(id, value) {
            if (AppState.currentSim) {
                AppState.currentSim.updateParam(id, value);
            }
        };

        window.switchSimTab = function(tabId) {
            document.getElementById('tab-explore').classList.remove('tab-active', 'text-slate-400');
            document.getElementById('tab-understand').classList.remove('tab-active', 'text-slate-400');
            
            document.getElementById('panel-explore').classList.add('hidden');
            document.getElementById('panel-understand').classList.add('hidden');
            
            if(tabId === 'explore') {
                document.getElementById('tab-explore').classList.add('tab-active');
                document.getElementById('tab-understand').classList.add('text-slate-400');
                document.getElementById('panel-explore').classList.remove('hidden');
            } else {
                document.getElementById('tab-understand').classList.add('tab-active');
                document.getElementById('tab-explore').classList.add('text-slate-400');
                document.getElementById('panel-understand').classList.remove('hidden');
            }
        };

        
        // Background animation for Home page
        function initHeroCanvas() {
            const canvas = document.getElementById('hero-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            let particles = [];
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1
                });
            }

            function animate() {
                if(window.location.hash !== '' && window.location.hash !== '#home') return; // Stop if not on home
                
                // Ensure size is correct
                if(canvas.width !== canvas.clientWidth) canvas.width = canvas.clientWidth;
                if(canvas.height !== canvas.clientHeight) canvas.height = canvas.clientHeight;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)'; // sci-accent
                
                for(let i=0; i<particles.length; i++) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(6, 182, 212, 0.5)';
                    ctx.fill();

                    // Connect close particles (Network effect)
                    for(let j=i+1; j<particles.length; j++) {
                        let p2 = particles[j];
                        let dist = Math.sqrt((p.x-p2.x)**2 + (p.y-p2.y)**2);
                        if(dist < 100) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // Bootstrap App
        window.onload = () => {
            // Check initial hash
            const hash = window.location.hash.substring(1);
            if (hash) {
                window.dispatchEvent(new Event('hashchange'));
            } else {
                navigate('home');
            }
        };
    </script>
</body>
</html>
