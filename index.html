        class Simulation {
            constructor(config, container) {
                this.config = config; this.container = container;
                this.params = {};
                config.params.forEach(p => this.params[p.id] = parseFloat(p.default));
                this.animId = null; this.isRunning = true;
            }
            updateParam(id, value) { this.params[id] = parseFloat(value); this.render(); }
            startLoop(drawFunc) {
                const loop = (timestamp) => {
                    if (!this.isRunning) return;
                    drawFunc(timestamp);
                    this.animId = requestAnimationFrame(loop);
                };
                this.animId = requestAnimationFrame(loop);
            }
            destroy() {
                this.isRunning = false;
                if (this.animId) cancelAnimationFrame(this.animId);
                this.container.innerHTML = '';
            }
            render() {} 
        }

        class IframeSim extends Simulation {
            init() {
                this.container.innerHTML = `<iframe src="${this.config.url}" class="external-sim-iframe" title="${this.config.title}"></iframe>`;
            }
        }

        class ElectricFieldSim extends Simulation {
            init() {
                this.container.innerHTML = '<canvas id="sim-canvas"></canvas>';
                this.canvas = document.getElementById('sim-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.charges = [ {x: 0.3, y: 0.5, q: 2}, {x: 0.7, y: 0.5, q: -2} ];
                
                this.resize = () => {
                    this.canvas.width = this.container.clientWidth;
                    this.canvas.height = this.container.clientHeight;
                    this.render();
                };
                window.addEventListener('resize', this.resize);
                this.resize();

                let dragging = null; let isAdding = false;
                window.handleCustomSimAction = (action) => {
                    if (action === 'add') { isAdding = true; this.canvas.style.cursor = 'crosshair'; }
                    if (action === 'clear') { this.charges = []; this.render(); }
                };

                this.canvas.addEventListener('mousedown', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / this.canvas.width;
                    const y = (e.clientY - rect.top) / this.canvas.height;
                    
                    if (isAdding) {
                        this.charges.push({x, y, q: this.params.chargeMag});
                        isAdding = false; this.canvas.style.cursor = 'default';
                        this.render(); return;
                    }
                    for (let c of this.charges) {
                        if (MathUtils.dist(x*this.canvas.width, y*this.canvas.height, c.x*this.canvas.width, c.y*this.canvas.height) < 20) { dragging = c; break; }
                    }
                });
                
                this.canvas.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    const rect = this.canvas.getBoundingClientRect();
                    dragging.x = (e.clientX - rect.left) / this.canvas.width;
                    dragging.y = (e.clientY - rect.top) / this.canvas.height;
                    this.render();
                });
                this.canvas.addEventListener('mouseup', () => { dragging = null; });
            }
            destroy() { super.destroy(); window.removeEventListener('resize', this.resize); delete window.handleCustomSimAction; }

            render() {
                const w = this.canvas.width; const h = this.canvas.height; const ctx = this.ctx;
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);
                const res = this.params.gridRes;
                const dx = w / res; const dy = h / res;
                
                for (let i = 0; i <= res; i++) {
                    for (let j = 0; j <= res; j++) {
                        const px = i * dx; const py = j * dy;
                        let Ex = 0, Ey = 0;
                        for (let c of this.charges) {
                            const cx = c.x * w; const cy = c.y * h;
                            const r2 = MathUtils.dist2(px, py, cx, cy);
                            if (r2 < 1) continue; 
                            const r = Math.sqrt(r2);
                            const E = c.q / r2; 
                            Ex += E * (px - cx) / r; Ey += E * (py - cy) / r;
                        }
                        const mag = Math.sqrt(Ex*Ex + Ey*Ey);
                        if (mag === 0) continue;
                        const drawLen = Math.min(dx * 0.8, (Math.log10(mag * 10000 + 1) / 3) * dx * 0.4);
                        const ux = (Ex / mag) * drawLen; const uy = (Ey / mag) * drawLen;
                        
                        const hue = MathUtils.map(Math.min(mag, 0.05), 0, 0.05, 200, 360);
                        ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.6)`; ctx.lineWidth = 1.5;
                        this.drawArrow(ctx, px, py, px + ux, py + uy);
                    }
                }
                
                for (let c of this.charges) {
                    ctx.beginPath(); ctx.arc(c.x * w, c.y * h, Math.abs(c.q)*3 + 5, 0, Math.PI*2);
                    ctx.fillStyle = c.q > 0 ? '#ef4444' : '#3b82f6'; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = '12px Inter'; ctx.fillText(c.q > 0 ? '+' : '-', c.x * w, c.y * h);
                }
            }
            
            drawArrow(ctx, fromx, fromy, tox, toy) {
                const headlen = 4; const angle = Math.atan2(toy - fromy, tox - fromx);
                ctx.beginPath(); ctx.moveTo(fromx, fromy); ctx.lineTo(tox, toy);
                ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(tox, toy);
                ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6)); ctx.stroke();
            }
        }

        class HarmonicOscillatorSim extends Simulation {
            init() {
                this.container.innerHTML = `
                    <div class="flex flex-col h-full w-full">
                        <canvas id="ho-canvas" class="flex-1 bg-slate-900 border-b border-slate-700"></canvas>
                        <div id="ho-plot" class="flex-1"></div>
                    </div>
                `;
                this.canvas = document.getElementById('ho-canvas'); this.ctx = this.canvas.getContext('2d');
                this.time = 0; this.history = { t: [], x: [] };
                this.resize = () => { this.canvas.width = this.canvas.clientWidth; this.canvas.height = this.canvas.clientHeight; };
                window.addEventListener('resize', this.resize); this.resize();
                this.startLoop((timestamp) => this.draw(timestamp));
            }
            destroy() { super.destroy(); window.removeEventListener('resize', this.resize); }

            draw(timestamp) {
                if(!this.lastTime) this.lastTime = timestamp;
                const dt = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp; this.time += dt;
                
                const m = this.params.m; const k = this.params.k; const A = this.params.A;
                const omega = Math.sqrt(k / m); const x = A * Math.cos(omega * this.time);
                
                const w = this.canvas.width; const h = this.canvas.height; const ctx = this.ctx;
                ctx.clearRect(0, 0, w, h);
                const originX = w / 2; const ceilingY = 20;
                const scale = (h - 100) / 4; 
                const blockY = h/2 + x * scale; const blockW = 40 + m * 5; 
                
                ctx.fillStyle = '#64748b'; ctx.fillRect(originX - 50, 0, 100, ceilingY);
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(originX, ceilingY);
                const coils = 10;
                for(let i=1; i<=coils; i++) {
                    const py = ceilingY + (blockY - ceilingY) * (i / coils);
                    const px = originX + (i % 2 === 0 ? 15 : -15);
                    if(i === coils) ctx.lineTo(originX, blockY); else ctx.lineTo(px, py);
                } ctx.stroke();
                
                ctx.fillStyle = '#38bdf8'; ctx.fillRect(originX - blockW/2, blockY, blockW, blockW);
                ctx.strokeStyle = '#0284c7'; ctx.strokeRect(originX - blockW/2, blockY, blockW, blockW);
                
                if (Math.floor(this.time * 10) % 2 === 0) {
                    this.history.t.push(this.time); this.history.x.push(x);
                    if (this.history.t.length > 100) { this.history.t.shift(); this.history.x.shift(); }
                    this.updatePlot();
                }
            }
            updatePlot() {
                if(!document.getElementById('ho-plot')) return;
                const trace = { x: this.history.t, y: this.history.x, type: 'scatter', mode: 'lines', line: {color: '#38bdf8', width: 2} };
                const layout = { paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { color: '#cbd5e1' }, margin: { t: 10, b: 40, l: 50, r: 20 }, yaxis: { range: [-2.5, 2.5] } };
                Plotly.react('ho-plot', [trace], layout, {displayModeBar: false});
            }
        }

        class EMWaveSim extends Simulation {
            init() {
                this.container.innerHTML = '<canvas id="em-canvas"></canvas>';
                this.canvas = document.getElementById('em-canvas'); this.ctx = this.canvas.getContext('2d');
                this.time = 0;
                this.resize = () => { this.canvas.width = this.container.clientWidth; this.canvas.height = this.container.clientHeight; };
                window.addEventListener('resize', this.resize); this.resize();
                this.startLoop(() => this.draw());
            }
            destroy() { super.destroy(); window.removeEventListener('resize', this.resize); }
            draw() {
                this.time += 0.05 * this.params.speed;
                const w = this.canvas.width; const h = this.canvas.height; const ctx = this.ctx;
                ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, w, h);
                const ox = 50; const oy = h / 2; const zScale = 0.5; 
                
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 1; ctx.beginPath();
                ctx.moveTo(0, oy); ctx.lineTo(w, oy); 
                ctx.moveTo(ox, 0); ctx.lineTo(ox, h); 
                ctx.moveTo(ox - 100*zScale, oy + 100*zScale); ctx.lineTo(ox + 200*zScale, oy - 200*zScale); 
                ctx.stroke();

                const k = (2 * Math.PI) / this.params.lambda; const amplitude = h * 0.25;
                ctx.lineWidth = 2;
                
                for (let z = 0; z < w; z += 5) {
                    const phase = k * z - this.time; const val = Math.cos(phase) * amplitude;
                    if (z % 20 === 0) {
                        ctx.strokeStyle = '#ef4444'; ctx.beginPath();
                        ctx.moveTo(ox + z, oy); ctx.lineTo(ox + z, oy - val); ctx.stroke();
                    }
                    if (z % 20 === 0) {
                        ctx.strokeStyle = '#3b82f6'; ctx.beginPath();
                        ctx.moveTo(ox + z, oy); ctx.lineTo(ox + z + val*zScale, oy - val*zScale); ctx.stroke();
                    }
                }
                
                ctx.beginPath(); ctx.strokeStyle = 'rgba(239, 68, 68, 0.8)';
                for (let z = 0; z < w; z++) {
                    const y = oy - Math.cos(k * z - this.time) * amplitude;
                    z === 0 ? ctx.moveTo(ox, y) : ctx.lineTo(ox + z, y);
                } ctx.stroke();
                
                ctx.beginPath(); ctx.strokeStyle = 'rgba(59, 130, 246, 0.8)';
                for (let z = 0; z < w; z++) {
                    const val = Math.cos(k * z - this.time) * amplitude;
                    const bX = ox + z + val*zScale; const bY = oy - val*zScale;
                    z === 0 ? ctx.moveTo(bX, bY) : ctx.lineTo(bX, bY);
                } ctx.stroke();
            }
        }

        const AppState = { currentSim: null, activeTab: 'explore' };

        function navigate(view, data = null) {
            const content = document.getElementById('app-content');
            if (AppState.currentSim) { AppState.currentSim.destroy(); AppState.currentSim = null; }
            if (view === 'home') renderHome(content);
            else if (view === 'subject') renderSubject(content, data);
            else if (view === 'simulation') renderSimulation(content, data);
            else renderHome(content); 
            lucide.createIcons(); window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (!hash) { navigate('home'); return; }
            const parts = hash.split('/');
            if (parts[0] === 'subject' && parts[1]) navigate('subject', parts[1]);
            else if (parts[0] === 'sim' && parts[1]) navigate('simulation', parts[1].replace(/%20/g, ' '));
            else navigate('home');
        });

            container.innerHTML = `

                        </div>
                        <h1 class="text-5xl md:text-7xl font-extrabold text-white tracking-tight mb-6">
                            Interactive <span class="text-transparent bg-clip-text bg-gradient-to-r from-sci-accent to-blue-500">Physics</span> Laboratory

                        <button onclick="window.location.hash='#subject/quantum'" class="px-8 py-3 rounded-md bg-sci-accent text-slate-900 font-bold hover:bg-cyan-400 transition-colors shadow-lg shadow-sci-accent/30">
                            Start Exploring
                        </button>
                    </div>

                <div class="py-16 px-6 max-w-[1400px] mx-auto w-full">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-2xl font-bold text-white flex items-center">
                            <i data-lucide="microscope" class="w-6 h-6 mr-2 text-sci-accent"></i> Available Modules & Simulations

                <div onclick="window.location.hash='#sim/${sim.id}'" class="glass-panel p-6 rounded-lg cursor-pointer hover:border-sci-accent transition-colors group">

                    <p class="text-sm text-slate-400 mb-4">${sim.description}</p>

        function renderSimulation(container, simId) {
            const config = Registry[simId];
            if (!config) return navigate('home');

            let controlsHTML = '';
            if(config.params) {
                config.params.forEach(p => {
                    if (p.type === 'slider') {
                        controlsHTML += `
                            <div class="mb-5">
                                <div class="flex justify-between items-end mb-1">
                                    <label class="block text-sm font-medium text-slate-300">${p.name}</label>
                                    <span id="val-${p.id}" class="text-xs font-mono text-sci-accent bg-slate-900 px-2 py-0.5 rounded border border-slate-700">${p.default} ${p.unit}</span>
                                </div>
                                <input type="range" id="input-${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.default}" 
                                    oninput="document.getElementById('val-${p.id}').innerText = this.value + ' ${p.unit}'; updateSimParam('${p.id}', this.value)">
                            </div>
                        `;
                    } else if (p.type === 'select') {
                        let options = p.options.map(opt => `<option value="${opt.val}" ${opt.val == p.default ? 'selected' : ''}>${opt.label}</option>`).join('');
                        controlsHTML += `
                            <div class="mb-5">
                                <label class="block text-sm font-medium text-slate-300 mb-1">${p.name}</label>
                                <select id="input-${p.id}" class="w-full bg-slate-900 border border-slate-700 rounded-md py-1.5 px-3 text-sm text-slate-300 focus:outline-none focus:border-sci-accent"
                                    onchange="updateSimParam('${p.id}', this.value)">
                                    ${options}
                                </select>
                            </div>

                    }

            if(config.customControls) controlsHTML += config.customControls;

            container.innerHTML = `
                <div class="bg-sci-panel border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-16 z-40">
                    <div class="flex items-center">
                        <button onclick="window.location.hash='#subject/${config.subjectId}'" class="text-slate-400 hover:text-white mr-4 p-1 rounded hover:bg-slate-800">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h2 class="text-lg font-bold text-white leading-tight">${config.title}</h2>
                            <span class="text-xs text-slate-500">${config.category}</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col lg:flex-row flex-grow w-full h-[calc(100vh-120px)]">
                    <div class="w-full lg:w-80 bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto shrink-0">
                        <div class="flex border-b border-slate-800 text-sm">
                            <button id="tab-explore" onclick="switchSimTab('explore')" class="flex-1 py-3 font-medium text-center tab-active hover:bg-slate-800 transition">Control Panel</button>
                            <button id="tab-understand" onclick="switchSimTab('understand')" class="flex-1 py-3 font-medium text-center text-slate-400 hover:bg-slate-800 transition">Theory</button>
                        </div>
                        
                        <div id="panel-explore" class="p-5 flex-grow">
                            ${controlsHTML}
                        </div>
                        
                        <div id="panel-understand" class="p-5 hidden text-sm text-slate-300 leading-relaxed overflow-y-auto">
                            <div class="mb-4">
                                <h4 class="font-bold text-white mb-1 border-b border-slate-700 pb-1">Description</h4>
                                <p>${config.description}</p>
                            </div>
                            ${config.objectives ? `
                            <div class="mb-4">
                                <h4 class="font-bold text-white mb-1 border-b border-slate-700 pb-1">Learning Objectives</h4>
                                <ul class="list-disc pl-4 space-y-1 mt-2">
                                    ${config.objectives.map(obj => `<li>${obj}</li>`).join('')}
                                </ul>
                            </div>` : ''}
                            <div>
                                <h4 class="font-bold text-white mb-1 border-b border-slate-700 pb-1">Mathematical Model</h4>
                                <div class="math-container text-[13px] bg-black/30 p-3 rounded border border-slate-800 mt-2 overflow-x-auto">
                                    ${config.equations}

                        </div>
                    </div>

                    <div class="flex-grow bg-slate-950 relative flex flex-col overflow-hidden p-2">

                        <div class="absolute bottom-4 right-4 glass-panel px-3 py-2 rounded text-xs font-mono text-slate-400 pointer-events-none hidden md:block z-10">

            if(config.customControls) {
                const btnAdd = document.getElementById('btnAddCharge');

                if(btnClear) btnClear.onclick = () => window.handleCustomSimAction('clear');
            }

            renderMathInElement(document.body, {
                delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ],
                throwOnError: false, output: 'html'
            });

            const simContainer = document.getElementById('sim-container');
            if (config.ClassRef === 'IframeSim') AppState.currentSim = new IframeSim(config, simContainer);
            else if (config.ClassRef === 'ElectricFieldSim') AppState.currentSim = new ElectricFieldSim(config, simContainer);
            else if (config.ClassRef === 'HarmonicOscillatorSim') AppState.currentSim = new HarmonicOscillatorSim(config, simContainer);
            else if (config.ClassRef === 'EMWaveSim') AppState.currentSim = new EMWaveSim(config, simContainer);

            if (AppState.currentSim) AppState.currentSim.init();

        window.updateSimParam = function(id, value) {
            if (AppState.currentSim) AppState.currentSim.updateParam(id, value);
        };

        window.switchSimTab = function(tabId) {
            document.getElementById('tab-explore').classList.remove('tab-active', 'text-slate-400');
            document.getElementById('tab-understand').classList.remove('tab-active', 'text-slate-400');
            document.getElementById('panel-explore').classList.add('hidden');
            document.getElementById('panel-understand').classList.add('hidden');
            
            if(tabId === 'explore') {
                document.getElementById('tab-explore').classList.add('tab-active');
                document.getElementById('tab-understand').classList.add('text-slate-400');
                document.getElementById('panel-explore').classList.remove('hidden');
            } else {
                document.getElementById('tab-understand').classList.add('tab-active');
                document.getElementById('tab-explore').classList.add('text-slate-400');
                document.getElementById('panel-understand').classList.remove('hidden');
            }
        };

        function initHeroCanvas() {
            const canvas = document.getElementById('hero-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;

            let particles = [];
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                    r: Math.random() * 2 + 1
                });
            }

            function animate() {
                if(window.location.hash !== '' && window.location.hash !== '#home') return; 
                
                if(canvas.width !== canvas.clientWidth) canvas.width = canvas.clientWidth;
                if(canvas.height !== canvas.clientHeight) canvas.height = canvas.clientHeight;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for(let i=0; i<particles.length; i++) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(6, 182, 212, 0.5)'; ctx.fill();

                    for(let j=i+1; j<particles.length; j++) {
                        let p2 = particles[j];
                        let dist = Math.sqrt((p.x-p2.x)**2 + (p.y-p2.y)**2);
                        if(dist < 100) {
                            ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
                            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.onload = () => {
            const hash = window.location.hash.substring(1);
            if (hash) window.dispatchEvent(new Event('hashchange'));
            else navigate('home');
        };
    </script>
